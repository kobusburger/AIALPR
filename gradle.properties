# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Speed optimizations
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# AndroidX and Style
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Network timeouts
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Fix for "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin"
# Required because of how KSP interacts with the experimental AGP 9.0 / Kotlin 2.3 setup.
android.disallowKotlinSourceSets=false

# Additional configuration
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
